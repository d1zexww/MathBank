<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    {% load static %}
    <link rel="stylesheet" href="{% static 'core/style.css' %}">

    <title>Вход — MathBank</title>
</head>

<body>

    <main class="auth-page">

        <div class="auth-card">

            <a href="/" class="logo">MathBank</a>

            <h1>С возвращением!</h1>

            <p>Войди в свой аккаунт, чтобы продолжить подготовку.</p>

            <form method="POST">

                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit" class="primary-button">
                    Войти
                </button>

            </form>

            <p>
                Нет аккаунта?
                <a href="{% url 'accounts:register' %}">
                    Зарегистрироваться
                </a>
            </p>

        </div>

    </main>

</body>
</html>
